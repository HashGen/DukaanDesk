<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#172b26">
  <meta name="description" content="Private daily sales and udhaar ledger for every shopkeeper.">
  <link rel="stylesheet" href="./style.css?v=1792660022">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>DukaanDesk — Smart Shop Hisab</title>
</head>
<body>
  <div id="app"></div>
  <script>
    window.__dukaanBoot = false;
    window.addEventListener('error', function (event) {
      console.error('DukaanDesk runtime error:', event.message, event.filename, event.lineno);
    });
    window.addEventListener('DOMContentLoaded', function () {
      setTimeout(function () {
        if (!window.__dukaanBoot) {
          var app = document.getElementById('app');
          app.innerHTML = '<main style="font:16px system-ui;padding:28px;color:#26382d"><h2>DukaanDesk load nahi ho paaya</h2><p>App script load nahi hui ya runtime error aaya. Chrome mein page ko reload karein.</p><button onclick="location.reload()" style="padding:12px 18px;background:#207d63;color:white;border:0;border-radius:8px">Reload app</button></main>';
        }
      }, 3500);
    });
  </script>
  <script>
  (function () {
    var key = 'dukaandesk-cache-clean-v3';
    try {
      if (sessionStorage.getItem(key) === 'done') return;
      sessionStorage.setItem(key, 'done');
    } catch (e) {}
    var jobs = [];
    if ('serviceWorker' in navigator) jobs.push(navigator.serviceWorker.getRegistrations().then(function (items) {
      return Promise.all(items.map(function (item) { return item.unregister(); }));
    }));
    if ('caches' in window) jobs.push(caches.keys().then(function (keys) {
      return Promise.all(keys.map(function (name) { return caches.delete(name); }));
    }));
    Promise.all(jobs).then(function () {
      if (navigator.serviceWorker && navigator.serviceWorker.controller) location.reload();
    }).catch(function () {});
  })();
</script>
  <script src="./app.js?v=1792660018" defer></script>
</body>
</html>
